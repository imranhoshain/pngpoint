version: "3.9"

services:
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    command:
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # 🔥 REQUIRED FOR LARGE UPLOADS (ROOT FIX)
      - "--entrypoints.web.forwardingTimeouts.readTimeout=600s"
      - "--entrypoints.web.forwardingTimeouts.writeTimeout=600s"
      - "--entrypoints.web.forwardingTimeouts.idleTimeout=600s"

      - "--entrypoints.websecure.forwardingTimeouts.readTimeout=600s"
      - "--entrypoints.websecure.forwardingTimeouts.writeTimeout=600s"
      - "--entrypoints.websecure.forwardingTimeouts.idleTimeout=600s"

      # ACME / Let's Encrypt
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=admin@pngpoint.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

      # Logs
      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      # buffer uploads safely
      - /var/lib/traefik/tmp:/tmp

    networks:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    expose:
      - "3000"
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # HTTPS redirect
      - "traefik.http.middlewares.pngpoint-https.redirectscheme.scheme=https"

      # HTTP
      - "traefik.http.routers.frontend-web.rule=Host(`pngpoint.com`) || Host(`www.pngpoint.com`)"
      - "traefik.http.routers.frontend-web.entrypoints=web"
      - "traefik.http.routers.frontend-web.middlewares=pngpoint-https"

      # HTTPS
      - "traefik.http.routers.frontend-secure.rule=Host(`pngpoint.com`) || Host(`www.pngpoint.com`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

      - "traefik.docker.network=web"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command: daphne -b 0.0.0.0 -p 8000 app.asgi:application
    volumes:
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    expose:
      - "8000"
    networks:
      - web
      - backend
    labels:
      - "traefik.enable=true"

      # 🔥 Buffering for large multipart uploads
      - "traefik.http.middlewares.upload-buffer.buffering.maxRequestBodyBytes=209715200"
      - "traefik.http.middlewares.upload-buffer.buffering.memRequestBodyBytes=10485760"

      # HTTP
      - "traefik.http.routers.backend-web.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/api/`)"
      - "traefik.http.routers.backend-web.entrypoints=web"
      - "traefik.http.routers.backend-web.middlewares=pngpoint-https,upload-buffer"

      # HTTPS
      - "traefik.http.routers.backend-secure.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/api/`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls.certresolver=le"
      - "traefik.http.routers.backend-secure.middlewares=upload-buffer"

      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=web"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command: celery -A app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    networks:
      - backend

  assets:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend/static:/usr/share/nginx/html/static:ro
      - ./backend/media:/usr/share/nginx/html/media:ro
      - ./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - web
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.assets.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      - "traefik.http.routers.assets.entrypoints=websecure"
      - "traefik.http.routers.assets.tls.certresolver=le"
      - "traefik.http.services.assets.loadbalancer.server.port=80"

      - "traefik.docker.network=web"

networks:
  web:
    name: web
  backend:
    name: backend
