services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env.local
    expose:
      - "3000"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.pngpoint-https.redirectscheme.scheme=https"
      - "traefik.http.routers.pngpoint-frontend-web.rule=Host(`pngpoint.com`) || Host(`www.pngpoint.com`)"
      - "traefik.http.routers.pngpoint-frontend-web.entrypoints=web"
      - "traefik.http.routers.pngpoint-frontend-web.middlewares=pngpoint-https"
      - "traefik.http.routers.pngpoint-frontend-web.priority=10"
      - "traefik.http.routers.pngpoint-frontend-secure.rule=Host(`pngpoint.com`) || Host(`www.pngpoint.com`)"
      - "traefik.http.routers.pngpoint-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.pngpoint-frontend-secure.tls.certresolver=le"
      - "traefik.http.routers.pngpoint-frontend-secure.priority=10"
      - "traefik.http.routers.pngpoint-frontend-secure.service=pngpoint-frontend-svc"
      - "traefik.http.services.pngpoint-frontend-svc.loadbalancer.server.port=3000"
      - "traefik.docker.network=web"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    command: daphne -b 0.0.0.0 -p 8000 app.asgi:application
    volumes:
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    expose:
      - "8000"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.pngpoint-https.redirectscheme.scheme=https"
      - "traefik.http.routers.pngpoint-backend-api-web.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/api/`)"
      - "traefik.http.routers.pngpoint-backend-api-web.entrypoints=web"
      - "traefik.http.routers.pngpoint-backend-api-web.middlewares=pngpoint-https"
      - "traefik.http.routers.pngpoint-backend-api-web.priority=100"
      - "traefik.http.routers.pngpoint-backend-api-secure.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/api/`)"
      - "traefik.http.routers.pngpoint-backend-api-secure.entrypoints=websecure"
      - "traefik.http.routers.pngpoint-backend-api-secure.tls.certresolver=le"
      - "traefik.http.routers.pngpoint-backend-api-secure.priority=100"
      - "traefik.http.routers.pngpoint-backend-api-web.service=pngpoint-backend-svc"
      - "traefik.http.routers.pngpoint-backend-api-secure.service=pngpoint-backend-svc"
      - "traefik.http.routers.pngpoint-backend-static-web.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/static/`)"
      - "traefik.http.routers.pngpoint-backend-static-web.entrypoints=web"
      - "traefik.http.routers.pngpoint-backend-static-web.middlewares=pngpoint-https"
      - "traefik.http.routers.pngpoint-backend-static-web.priority=90"
      - "traefik.http.routers.pngpoint-backend-static-secure.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/static/`)"
      - "traefik.http.routers.pngpoint-backend-static-secure.entrypoints=websecure"
      - "traefik.http.routers.pngpoint-backend-static-secure.tls.certresolver=le"
      - "traefik.http.routers.pngpoint-backend-static-secure.priority=90"
      - "traefik.http.routers.pngpoint-backend-static-web.service=pngpoint-backend-svc"
      - "traefik.http.routers.pngpoint-backend-static-secure.service=pngpoint-backend-svc"
      - "traefik.http.routers.pngpoint-backend-media-web.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/media/`)"
      - "traefik.http.routers.pngpoint-backend-media-web.entrypoints=web"
      - "traefik.http.routers.pngpoint-backend-media-web.middlewares=pngpoint-https"
      - "traefik.http.routers.pngpoint-backend-media-web.priority=90"
      - "traefik.http.routers.pngpoint-backend-media-secure.rule=(Host(`pngpoint.com`) || Host(`www.pngpoint.com`)) && PathPrefix(`/media/`)"
      - "traefik.http.routers.pngpoint-backend-media-secure.entrypoints=websecure"
      - "traefik.http.routers.pngpoint-backend-media-secure.tls.certresolver=le"
      - "traefik.http.routers.pngpoint-backend-media-secure.priority=90"
      - "traefik.http.routers.pngpoint-backend-media-web.service=pngpoint-backend-svc"
      - "traefik.http.routers.pngpoint-backend-media-secure.service=pngpoint-backend-svc"
      - "traefik.http.services.pngpoint-backend-svc.loadbalancer.server.port=8000"
      - "traefik.docker.network=web"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    depends_on:
      - backend
    command: celery -A app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    networks:
      - web

networks:
  web:
    external: true
