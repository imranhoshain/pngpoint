name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment_branch:
        required: false
        type: string
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: app.settings.prod
      ENV: prod
      FRONTEND_DOMAIN: http://localhost:3000
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpq-dev

      - name: Normalize requirements encoding
        run: |
          python - <<'PY'
          from pathlib import Path
          data = Path("requirements.txt").read_text(encoding="utf-16")
          Path("requirements-ci.txt").write_text(data, encoding="utf-8")
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Django checks
        run: python manage.py check

      - name: Ensure migrations are up-to-date
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

  docker-compose:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compose network
        run: docker network create web || true

      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config

      - name: Build application images
        run: docker compose -f docker-compose.yml build

  deploy:
    name: Deploy to Server
    needs:
      - frontend
      - backend
      - docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known_hosts (staging)
        if: github.ref_name == 'staging'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Add known_hosts (production)
        if: github.ref_name == 'main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: inputs.environment_branch == 'staging' || github.ref_name == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER }}" <<'SSH'
            set -e
            cd /var/apps/staging.pngpoint.com
            echo "Fetching latest staging branch..."
            git fetch origin staging
            git reset --hard origin/staging
            echo "Pulling latest Docker images and restarting..."
            docker compose pull || true
            docker compose up -d --build
            echo "✅ Staging deployed successfully."
          SSH

      - name: Deploy to Production
        if: inputs.environment_branch == 'main' || github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.PRODUCTION_SERVER }}" <<'SSH'
            set -e
            cd /var/apps/pngpoint.com
            echo "Fetching latest production branch..."
            git fetch origin main
            git reset --hard origin/main
            echo "Pulling latest Docker images and restarting..."
            docker compose pull || true
            docker compose up -d --build
            echo "✅ Production deployed successfully."
          SSH
