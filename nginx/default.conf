# ===============================
# Redirects
# ===============================
server {
    listen 80;
    server_name pngpoint.com www.pngpoint.com;
    return 301 https://pngpoint.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.pngpoint.com;

    ssl_certificate /etc/letsencrypt/live/pngpoint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pngpoint.com/privkey.pem;

    return 301 https://pngpoint.com$request_uri;
}

# ===============================
# Main HTTPS server for pngpoint.com
# ===============================
server {
    listen 443 ssl http2;
    server_name pngpoint.com;

    ssl_certificate /etc/letsencrypt/live/pngpoint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pngpoint.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    client_max_body_size 5G;

    # Next.js Node.js server proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API passthrough
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static + media (Django)
    location /static/ {
        alias /backend/static/;
        add_header Cache-Control "public, max-age=31536000";
    }

    location /media/ {
        alias /backend/media/;
    }
}
